<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo — Leal Cosméticos</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rose: #c4517a;
        --rose2: #8b3457;
        --rose3: #f9e8ef;
        --blush: #fdf5f8;
        --dark: #1a0d14;
        --mid: #5c3347;
        --muted: #a07090;
        --border: #eddde6;
        --card: #ffffff;
        --wpp: #25d366;
        --r: 18px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Outfit", sans-serif;
        background: var(--blush);
        color: var(--dark);
        overflow-x: hidden;
      }

      /* ── CURSOR CUSTOM ── */
      body {
        cursor: none;
      }
      #cursor {
        position: fixed;
        width: 12px;
        height: 12px;
        background: var(--rose);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition:
          transform 0.1s,
          width 0.2s,
          height 0.2s,
          opacity 0.2s;
        mix-blend-mode: multiply;
      }
      #cursor-ring {
        position: fixed;
        width: 36px;
        height: 36px;
        border: 1.5px solid var(--rose);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        transition:
          transform 0.18s ease-out,
          width 0.25s,
          height 0.25s,
          opacity 0.2s;
        opacity: 0.5;
      }
      a,
      button {
        cursor: none;
      }

      /* ── HERO ── */
      .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 60px 24px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(
          160deg,
          #1a0d14 0%,
          #3d1530 40%,
          #7a2652 70%,
          #c4517a 100%
        );
      }

      /* partículas flutuantes */
      .hero-particle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        animation: floatUp linear infinite;
        pointer-events: none;
      }
      @keyframes floatUp {
        0% {
          transform: translateY(100vh) scale(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 0.4;
        }
        100% {
          transform: translateY(-20vh) scale(1);
          opacity: 0;
        }
      }

      /* texto hero animado */
      .hero-eyebrow {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 20px;
        animation: fadeUp 0.8s ease both;
      }

      .hero-title {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(3rem, 10vw, 6.5rem);
        font-weight: 700;
        color: #fff;
        line-height: 0.95;
        margin-bottom: 8px;
        animation: fadeUp 0.9s 0.1s ease both;
      }

      .hero-title em {
        font-style: italic;
        color: #f5c6d8;
      }

      .hero-sub {
        font-weight: 600;
        color: #f5c6d8;
        font-size: 1.1rem;
        max-width: 400px;
        line-height: 1.7;
        margin: 18px auto 36px;
        white-space: pre-wrap;
        line-height: 1.6;
        white-space: pre-wrap;
        border-right: 1px solid #f5c6d8;
        padding-right: 8px;
        animation: fadeUp 1s 0.2s ease both;
      }

      .hero-search {
        display: flex;
        width: 100%;
        max-width: 460px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50px;
        overflow: hidden;
        animation: fadeUp 1s 0.3s ease both;
        transition:
          background 0.3s,
          border 0.3s;
      }
      .hero-search:focus-within {
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.4);
      }
      .hero-search input {
        flex: 1;
        padding: 15px 22px;
        background: transparent;
        border: none;
        outline: none;
        color: #fff;
        font-size: 0.95rem;
        font-family: "Outfit", sans-serif;
      }
      .hero-search input::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }
      .hero-search button {
        padding: 12px 24px;
        background: var(--rose);
        border: none;
        color: #fff;
        font-weight: 600;
        font-size: 0.88rem;
        font-family: "Outfit", sans-serif;
        border-radius: 0 50px 50px 0;
        transition: background 0.2s;
      }
      .hero-search button:hover {
        background: var(--rose2);
      }

      .hero-scroll {
        position: absolute;
        bottom: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        animation: fadeUp 1s 0.6s ease both;
      }
      .scroll-line {
        width: 1px;
        height: 40px;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        animation: scrollPulse 2s ease-in-out infinite;
      }
      @keyframes scrollPulse {
        0%,
        100% {
          transform: scaleY(1);
          opacity: 0.4;
        }
        50% {
          transform: scaleY(1.4);
          opacity: 1;
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── STRIP ANIMADO ── */
      .strip-wrap {
        overflow: hidden;
        background: var(--rose);
        padding: 14px 0;
        border-top: 1px solid var(--rose2);
        border-bottom: 1px solid var(--rose2);
      }
      .strip-track {
        display: flex;
        gap: 0;
        width: max-content;
        animation: stripRun 18s linear infinite;
      }
      @keyframes stripRun {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }
      .strip-item {
        padding: 0 32px;
        color: rgba(255, 255, 255, 0.85);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .strip-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        flex-shrink: 0;
      }

      /* ── MAIN ── */
      .main {
        max-width: 1240px;
        margin: 0 auto;
        /*padding: 60px 24px 140px;*/
        padding: 36px 18px 120px;
      }

      /* ── SECTION HEADER ── */
      .section-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 36px;
      }
      .section-label {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--rose);
        margin-bottom: 6px;
      }
      .section-title {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        font-weight: 700;
        color: var(--dark);
        line-height: 1.1;
      }

      /* ── FILTROS ── */
      .filtros {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 8px 18px;
        border-radius: 50px;
        border: 1.5px solid var(--border);
        background: var(--card);
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--muted);
        transition: all 0.25s;
        font-family: "Outfit", sans-serif;
        position: relative;
        overflow: hidden;
      }
      .chip::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--rose);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.25s ease;
        z-index: 0;
      }
      .chip span {
        position: relative;
        z-index: 1;
      }
      .chip:hover::before {
        transform: scaleX(1);
      }
      .chip:hover {
        color: #fff;
        border-color: var(--rose);
      }
      .chip.ativo::before {
        transform: scaleX(1);
      }
      .chip.ativo {
        color: #fff;
        border-color: var(--rose);
      }

      /* ── GRID ── */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 24px;
      }

      /* ── CARD ── */
      .card {
        background: var(--card);
        border-radius: var(--r);
        overflow: hidden;
        border: 1px solid var(--border);
        transition:
          transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.3s;
        display: flex;
        flex-direction: column;
        opacity: 0;
        animation: cardIn 0.5s ease forwards;
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card:hover {
        transform: translateY(-8px) scale(1.01);
        box-shadow: 0 20px 60px rgba(196, 81, 122, 0.18);
      }

      .card-img-wrap {
        position: relative;
        overflow: hidden;
        aspect-ratio: 1;
        background: linear-gradient(135deg, #f9e8ef, #eddde6);
      }

      .card-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        display: block;
      }
      .card:hover .card-img {
        transform: scale(1.08);
      }

      .card-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        background: linear-gradient(
          135deg,
          #f9e8ef 0%,
          #fdf0f5 50%,
          #eddde6 100%
        );
      }

      /* overlay ao hover */
      .card-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(26, 13, 20, 0.7) 0%,
          transparent 50%
        );
        opacity: 0;
        transition: opacity 0.3s;
        display: flex;
        align-items: flex-end;
        padding: 16px;
      }
      .card:hover .card-overlay {
        opacity: 1;
      }
      .card-overlay-text {
        color: rgba(255, 255, 255, 0.85);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .badge-esgotado {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(26, 13, 20, 0.75);
        color: rgba(255, 255, 255, 0.85);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 20px;
        backdrop-filter: blur(6px);
      }

      .badge-novo {
        position: absolute;
        top: 12px;
        right: 12px;
        background: var(--rose);
        color: #fff;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 20px;
      }

      .card-body {
        padding: 18px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .card-marca {
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--rose);
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .card-nome {
        font-size: 0.98rem;
        font-weight: 600;
        color: var(--dark);
        line-height: 1.3;
      }

      .card-preco {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--rose);
        margin-top: 8px;
      }

      .card-footer {
        padding: 0 18px 18px;
      }

      .btn-add {
        width: 100%;
        padding: 11px;
        border-radius: 12px;
        border: 1.5px solid var(--border);
        background: var(--blush);
        font-size: 0.84rem;
        font-weight: 600;
        color: var(--mid);
        font-family: "Outfit", sans-serif;
        transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        position: relative;
        overflow: hidden;
      }
      .btn-add::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--rose);
        transform: translateY(100%);
        transition: transform 0.25s ease;
        z-index: 0;
      }
      .btn-add span {
        position: relative;
        z-index: 1;
        transition: color 0.25s;
      }
      .btn-add:hover::after {
        transform: translateY(0);
      }
      .btn-add:hover span {
        color: #fff;
      }
      .btn-add:hover {
        border-color: var(--rose);
      }
      .btn-add.adicionado {
        background: #d1fae5;
        border-color: #10b981;
      }
      .btn-add.adicionado span {
        color: #065f46;
      }
      .btn-add:disabled {
        opacity: 0.4;
      }

      /* ── EMPTY ── */
      .empty {
        grid-column: 1/-1;
        text-align: center;
        padding: 100px 20px;
        color: var(--muted);
      }
      .empty-icon {
        font-size: 4rem;
        margin-bottom: 16px;
        opacity: 0.5;
      }

      /* ── FAB ── */
      .fab {
        z-index: 500;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--rose), var(--rose2));
        border: none;
        color: #fff;
        font-size: 1.5rem;
        box-shadow: 0 8px 28px rgba(196, 81, 122, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.3s;
        position: relative;
      }

      .fab-wrap {
        position: fixed;
        bottom: 32px;
        right: 32px;
        z-index: 500;
      }

      .fab:hover {
        transform: scale(1.12) rotate(-5deg);
        box-shadow: 0 12px 36px rgba(196, 81, 122, 0.55);
      }
      .fab-badge {
        position: absolute;
        top: -5px;
        right: -5px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        color: var(--rose);
        font-size: 0.72rem;
        font-weight: 800;
        display: none;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--rose);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }
      .fab-pulse {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--rose);
        opacity: 0;
        animation: pulse 2.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.8);
          opacity: 0;
        }
      }

      /* ── DRAWER ── */
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(26, 13, 20, 0.5);
        z-index: 600;
        backdrop-filter: blur(4px);
      }
      .overlay.aberto {
        display: block;
      }

      .drawer {
        position: fixed;
        top: 0;
        right: -100%;
        max-width: 420px;
        width: 100%;
        height: 100%;
        background: var(--card);
        z-index: 601;
        display: flex;
        flex-direction: column;
        transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: -12px 0 60px rgba(26, 13, 20, 0.2);
      }
      .drawer.aberto {
        right: 0;
      }

      .drawer-head {
        padding: 28px 22px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .drawer-head-title {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--dark);
      }
      .btn-close {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--blush);
        font-size: 0.95rem;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        font-family: "Outfit", sans-serif;
      }
      .btn-close:hover {
        background: #fee2e2;
        color: #c0392b;
        border-color: #fca5a5;
      }

      .drawer-items {
        flex: 1;
        overflow-y: auto;
        padding: 18px 22px;
      }
      .drawer-empty {
        text-align: center;
        padding: 64px 20px;
        color: var(--muted);
        line-height: 1.9;
        font-size: 0.95rem;
      }

      .ditem {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
        animation: fadeUp 0.3s ease both;
      }
      .ditem:last-child {
        border-bottom: none;
      }
      .ditem-img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        object-fit: cover;
        background: var(--blush);
        flex-shrink: 0;
      }
      .ditem-ph {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: linear-gradient(135deg, #f9e8ef, #eddde6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        flex-shrink: 0;
      }
      .ditem-info {
        flex: 1;
        min-width: 0;
      }
      .ditem-nome {
        font-size: 0.9rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ditem-preco {
        font-size: 0.85rem;
        color: var(--rose);
        font-weight: 700;
        margin-top: 3px;
      }
      .ditem-qtd {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ditem-qtd button {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1.5px solid var(--border);
        background: var(--blush);
        font-size: 1rem;
        color: var(--mid);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        font-family: "Outfit", sans-serif;
      }
      .ditem-qtd button:hover {
        background: var(--rose);
        border-color: var(--rose);
        color: #fff;
      }
      .ditem-qtd span {
        font-weight: 700;
        min-width: 20px;
        text-align: center;
        font-size: 0.9rem;
      }

      .drawer-foot {
        padding: 20px 22px;
        border-top: 1px solid var(--border);
        background: var(--blush);
      }
      .drawer-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .drawer-total-label {
        font-size: 0.85rem;
        color: var(--muted);
        font-weight: 500;
      }
      .drawer-total-val {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--rose);
      }
      .obs {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        font-size: 0.88rem;
        font-family: "Outfit", sans-serif;
        color: var(--dark);
        resize: none;
        height: 60px;
        outline: none;
        margin-bottom: 14px;
        background: #fff;
        transition: border-color 0.2s;
      }
      .obs:focus {
        border-color: var(--rose);
      }

      .btn-wpp {
        width: 100%;
        padding: 15px;
        background: var(--wpp);
        color: #fff;
        border: none;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 700;
        font-family: "Outfit", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .btn-wpp:hover:not(:disabled) {
        background: #1ebe5d;
        transform: translateY(-2px);
      }
      .btn-wpp:disabled {
        background: #ccc;
      }

      /* ── FOOTER ── */
      .site-footer {
        text-align: center;
        padding: 28px;
        color: var(--muted);
        font-size: 0.82rem;
        border-top: 1px solid var(--border);
      }

      @media (max-width: 480px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
        }
        .drawer {
          max-width: 100%;
        }
        #cursor,
        #cursor-ring {
          display: none;
        }
        body {
          cursor: auto;
        }
        a,
        button {
          cursor: pointer;
        }
      }

      /* ─────────────────────────────
   PERFORMANCE MOBILE / UX
───────────────────────────── */

      body {
        -webkit-font-smoothing: antialiased;
      }

      /* evita lag no iPhone */
      .drawer-items {
        -webkit-overflow-scrolling: touch;
      }

      /* melhora renderização */

      /* desativa hover pesado em touch */

    <script>
      const isMobile = window.innerWidth <= 768;
      const WPP_NUM = "5551986117103";
      const LOJA_NOME = "Leal Cosméticos";

      // ── TEXTO HERO ──
      const textoHero = "✨ Perfume é mais que aroma, é identidade.";
      const textoEl = document.getElementById("textoExemplo");

      if (textoEl) {
        let pos = 0;

        function digitarTextoHero() {
          textoEl.textContent = textoHero.slice(0, pos);
          pos++;

          if (pos <= textoHero.length) {
            setTimeout(digitarTextoHero, 45);
          }
        }

        digitarTextoHero();
      }

      // ── CURSOR ──
      if (!isMobile) {
        const cur = document.getElementById("cursor");
        const ring = document.getElementById("cursor-ring");

        let mx = 0,
          my = 0,
          rx = 0,
          ry = 0;

        document.addEventListener("mousemove", (e) => {
          mx = e.clientX;
          my = e.clientY;
        });

        (function animCursor() {
          rx += (mx - rx) * 0.18;
          ry += (my - ry) * 0.18;

          cur.style.left = mx + "px";
          cur.style.top = my + "px";

          ring.style.left = rx + "px";
          ring.style.top = ry + "px";

          requestAnimationFrame(animCursor);
        })();
      }

      // ── PARTÍCULAS HERO ──
      const hero = document.getElementById("hero");
      const particleCount = isMobile ? 4 : 18;

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement("div");
        p.className = "hero-particle";

        const s = 4 + Math.random() * 20;

        p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;animation-duration:${8 + Math.random() * 14}s;animation-delay:${Math.random() * 10}s;opacity:${0.04 + Math.random() * 0.1}`;

        hero.appendChild(p);
      }

      // ── STRIP ──
      const stripWords = [
        "✦ Perfumes",
        "✦ Cremes",
        "✦ Maquiagem",
        "✦ Hidratantes",
        "✦ Cosméticos",
        "✦ Novidades",
        "✦ Promoções",
        "✦ Produtos Premium",
      ];

      const stripEl = document.getElementById("strip");

      const stripHTML = stripWords
        .map(
          (w) =>
            `<span class="strip-item">${w}<span class="strip-dot"></span></span>`,
        )
        .join("");

      stripEl.innerHTML = stripHTML + stripHTML;

      // ── ESTADO ──
      let todos = [];
      let filtrados = [];
      let carrinho = [];
      let buscaAtual = "";
      let filtroAtual = "todos";

      function garantirCarrinho() {
        if (!Array.isArray(carrinho)) {
          carrinho = [];
        }

        return carrinho;
      }

      function normalizarNumero(valor) {
        if (valor === null || valor === undefined || valor === "") return 0;

        if (typeof valor === "string") {
          valor = valor.replace(",", ".");
        }

        return Number(valor) || 0;
      }

      function formatarPreco(valor) {
        return normalizarNumero(valor).toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }

      function temPromocaoProduto(p) {
        const precoNormal = normalizarNumero(p.preco_venda);
        const precoPromo = normalizarNumero(p.preco_promocional);

        const promocaoAtiva =
          p.promocao_ativa === true ||
          p.promocao_ativa === "true" ||
          p.promocao_ativa === 1 ||
          p.promocao_ativa === "1";

        return promocaoAtiva && precoPromo > 0 && precoPromo < precoNormal;
      }

      function getPrecoFinal(p) {
        return temPromocaoProduto(p)
          ? normalizarNumero(p.preco_promocional)
          : normalizarNumero(p.preco_venda);
      }

      async function carregar() {
        try {
          const r = await fetch("/catalogo/produtos");

          if (!r.ok) {
            throw new Error("Erro ao carregar produtos do catálogo");
          }

          todos = await r.json();

          preencherFiltros();
          aplicarFiltros();
        } catch (e) {
          console.error("Erro ao carregar catálogo:", e);

          document.getElementById("grid").innerHTML =
            `<div class="empty"><div class="empty-icon">😕</div><p>Não foi possível carregar os produtos.</p></div>`;
        }
      }

      function preencherFiltros() {
        const marcas = [
          ...new Set(todos.map((p) => p.marca).filter(Boolean)),
        ].sort();

        const container = document.getElementById("filtros");

        container.innerHTML = `
          <button class="chip chip-filtro ativo" onclick="filtrarCatalogo('todos', this)">
            <span>Todos</span>
          </button>

          <button class="chip chip-filtro" onclick="filtrarCatalogo('promocoes', this)">
            <span>🔥 Promoções</span>
          </button>
        `;

        marcas.forEach((m) => {
          const btn = document.createElement("button");
          btn.className = "chip chip-filtro";
          btn.innerHTML = `<span>${m}</span>`;
          btn.onclick = () => filtrarCatalogo("marca:" + m, btn);
          container.appendChild(btn);
        });
      }

      function filtrarCatalogo(filtro, el) {
        filtroAtual = filtro;

        document
          .querySelectorAll(".chip-filtro")
          .forEach((c) => c.classList.remove("ativo"));

        if (el) {
          el.classList.add("ativo");
        }

        aplicarFiltros();
      }

      function buscar(q) {
        buscaAtual = (q || "").toLowerCase().trim();
        aplicarFiltros();
      }

      function aplicarFiltros() {
        filtrados = todos.filter((p) => {
          const nome = (p.nome || "").toLowerCase();
          const marca = (p.marca || "").toLowerCase();

          const okBusca =
            !buscaAtual ||
            nome.includes(buscaAtual) ||
            marca.includes(buscaAtual);

          let okFiltro = true;

          if (filtroAtual === "promocoes") {
            okFiltro = temPromocaoProduto(p);
          }

          if (filtroAtual.startsWith("marca:")) {
            const marcaSelecionada = filtroAtual.replace("marca:", "");
            okFiltro = p.marca === marcaSelecionada;
          }

          return okBusca && okFiltro;
        });

        renderGrid();
      }

      function renderGrid() {
        const grid = document.getElementById("grid");

        if (!filtrados.length) {
          grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>Nenhum produto encontrado.</p></div>`;
          return;
        }

        garantirCarrinho();

        grid.innerHTML = filtrados
          .map((p, i) => {
            const precoNormal = normalizarNumero(p.preco_venda);
            const precoPromo = normalizarNumero(p.preco_promocional);
            const temPromo = temPromocaoProduto(p);

            const esgot = normalizarNumero(p.quantidade) <= 0;

            const noCart = carrinho.some(
              (c) => Number(c.produto.id) === Number(p.id),
            );

            const img = p.imagemproduto
              ? `<img class="card-img" src="${p.imagemproduto}" alt="${p.nome || ""}" loading="lazy" decoding="async"/>`
              : `<div class="card-placeholder">💄</div>`;

            const isNovo = i < 2;

            const precoHtml = temPromo
              ? `
                <div class="card-preco-wrap">
                  <span class="card-preco-antigo">De ${formatarPreco(precoNormal)}</span>
                  <span class="card-preco-promo">Por ${formatarPreco(precoPromo)}</span>
                </div>
              `
              : `
                <div class="card-preco-wrap">
                  <span class="card-preco-normal">${formatarPreco(precoNormal)}</span>
                </div>
              `;

            return `
              <div class="card" style="animation-delay:${i * 0.06}s" onclick="abrirModalProdutoCatalogo(${p.id})">
                <div class="card-img-wrap">
                  ${img}

                  <div class="card-overlay">
                    <span class="card-overlay-text">Ver produto</span>
                  </div>

                  ${esgot ? '<span class="badge-esgotado">Esgotado</span>' : ""}
                  ${temPromo && !esgot ? '<span class="badge-promo">Promoção</span>' : ""}
                  ${isNovo && !esgot && !temPromo ? '<span class="badge-novo">Novo</span>' : ""}
                </div>

                <div class="card-body">
                  <div class="card-marca">${p.marca || ""}</div>
                  <div class="card-nome">${p.nome || ""}</div>
                  ${precoHtml}
                </div>

                <div class="card-footer">
                  <button
                    class="btn-add ${noCart ? "adicionado" : ""}"
                    onclick="event.stopPropagation(); toggleCarrinho(${p.id})"
                    ${esgot ? "disabled" : ""}
                  >
                    <span>
                      ${esgot ? "😕 Esgotado" : noCart ? "✓ Adicionado" : "+ Adicionar ao pedido"}
                    </span>
                  </button>
                </div>
              </div>`;
          })
          .join("");
      }

      function abrirModalProdutoCatalogo(id) {
        const produto = todos.find((p) => Number(p.id) === Number(id));
        if (!produto) return;

        garantirCarrinho();

        const overlay = document.getElementById("produtoModalOverlay");
        const imgBox = document.getElementById("produtoModalImg");
        const badges = document.getElementById("produtoModalBadges");
        const marca = document.getElementById("produtoModalMarca");
        const nome = document.getElementById("produtoModalNome");
        const preco = document.getElementById("produtoModalPreco");
        const desc = document.getElementById("produtoModalDesc");
        const estoque = document.getElementById("produtoModalEstoque");
        const btnAdd = document.getElementById("produtoModalBtnAdd");

        if (
          !overlay ||
          !imgBox ||
          !badges ||
          !marca ||
          !nome ||
          !preco ||
          !desc ||
          !estoque ||
          !btnAdd
        ) {
          return;
        }

        const precoNormal = normalizarNumero(produto.preco_venda);
        const precoPromo = normalizarNumero(produto.preco_promocional);
        const temPromo = temPromocaoProduto(produto);
        const qtd = normalizarNumero(produto.quantidade);
        const esgotado = qtd <= 0;

        const estaNoCarrinho = carrinho.some(
          (c) => Number(c.produto.id) === Number(produto.id),
        );

        imgBox.innerHTML = produto.imagemproduto
          ? `<img src="${produto.imagemproduto}" alt="${produto.nome || ""}" />`
          : `<div class="produto-modal-placeholder">💄</div>`;

        badges.innerHTML = `
          ${temPromo && !esgotado ? '<span class="produto-modal-badge promo">Promoção</span>' : ""}
          ${esgotado ? '<span class="produto-modal-badge esgotado">Esgotado</span>' : ""}
        `;

        marca.textContent = produto.marca || "";
        nome.textContent = produto.nome || "";

        preco.innerHTML = temPromo
          ? `
            <span class="preco-antigo">De ${formatarPreco(precoNormal)}</span>
            <span class="preco-promo">Por ${formatarPreco(precoPromo)}</span>
          `
          : `
            <span class="preco-normal">${formatarPreco(precoNormal)}</span>
          `;

        desc.textContent = temPromo
          ? "Produto em promoção por tempo limitado."
          : "Produto disponível no catálogo Leal Cosméticos.";

        estoque.textContent =
          produto.descricao && produto.descricao.trim()
            ? produto.descricao
            : "Sem descrição cadastrada para este produto.";

        btnAdd.disabled = esgotado;
        btnAdd.classList.toggle("adicionado", estaNoCarrinho);
        btnAdd.textContent = esgotado
          ? "Produto esgotado"
          : estaNoCarrinho
            ? "✓ Remover do pedido"
            : "+ Adicionar ao pedido";

        btnAdd.onclick = function () {
          fecharModalProdutoCatalogo();
          toggleCarrinho(produto.id);
        };

        overlay.classList.add("aberto");
        document.body.style.overflow = "hidden";
      }

      function fecharModalProdutoCatalogo() {
        const overlay = document.getElementById("produtoModalOverlay");
        if (overlay) overlay.classList.remove("aberto");

        const drawer = document.getElementById("drawer");
        const drawerAberto = drawer && drawer.classList.contains("aberto");

        document.body.style.overflow = drawerAberto ? "hidden" : "";
      }

      function toggleCarrinho(id) {
        garantirCarrinho();

        const produto = todos.find((p) => Number(p.id) === Number(id));
        if (!produto) return;

        const idx = carrinho.findIndex(
          (c) => Number(c.produto.id) === Number(id),
        );

        const isNew = idx < 0;

        if (isNew) {
          carrinho.push({ produto, qtd: 1 });
        } else {
          carrinho.splice(idx, 1);
        }

        atualizarFAB();
        renderGrid();
        renderDrawer();

        if (isNew && carrinho.length === 1) {
          abrirDrawer();
        }
      }

      function alterarQtd(id, d) {
        garantirCarrinho();

        const idx = carrinho.findIndex(
          (c) => Number(c.produto.id) === Number(id),
        );

        if (idx < 0) return;

        carrinho[idx].qtd = normalizarNumero(carrinho[idx].qtd) + d;

        if (carrinho[idx].qtd <= 0) {
          carrinho.splice(idx, 1);
        }

        atualizarFAB();
        renderDrawer();
        renderGrid();
      }

      function atualizarFAB() {
        garantirCarrinho();

        const b = document.getElementById("fabBadge");
        if (!b) return;

        const totalItens = carrinho.reduce(
          (s, c) => s + normalizarNumero(c.qtd),
          0,
        );

        b.textContent = totalItens;
        b.style.display = totalItens > 0 ? "flex" : "none";
      }

      function renderDrawer() {
        garantirCarrinho();

        const cont = document.getElementById("drawerItems");
        const tv = document.getElementById("drawerTotal");
        const btn = document.getElementById("btnWpp");

        if (!cont || !tv || !btn) return;

        if (!carrinho.length) {
          cont.innerHTML =
            '<div class="drawer-empty">Nenhum item ainda.<br>Adicione produtos ao lado! 💜</div>';

          tv.textContent = "R$ 0,00";
          btn.disabled = true;
          return;
        }

        let total = 0;

        cont.innerHTML = carrinho
          .map((item) => {
            const produto = item.produto;
            const qtd = normalizarNumero(item.qtd) || 1;

            const precoFinal = getPrecoFinal(produto);
            const sub = precoFinal * qtd;

            total += sub;

            const img = produto.imagemproduto
              ? `<img class="ditem-img" src="${produto.imagemproduto}" alt="${produto.nome || ""}"/>`
              : `<div class="ditem-ph">💄</div>`;

            return `
              <div class="ditem">
                ${img}

                <div class="ditem-info">
                  <div class="ditem-nome">${produto.nome || ""}</div>
                  <div class="ditem-preco">${formatarPreco(sub)}</div>
                </div>

                <div class="ditem-qtd">
                  <button onclick="alterarQtd(${produto.id}, -1)">−</button>
                  <span>${qtd}</span>
                  <button onclick="alterarQtd(${produto.id}, 1)">+</button>
                </div>
              </div>`;
          })
          .join("");

        tv.textContent = formatarPreco(total);
        btn.disabled = false;
      }

      function abrirDrawer() {
        garantirCarrinho();

        renderDrawer();

        const drawer = document.getElementById("drawer");
        const overlay = document.getElementById("overlay");

        if (drawer) drawer.classList.add("aberto");
        if (overlay) overlay.classList.add("aberto");

        document.body.style.overflow = "hidden";
      }

      function fecharDrawer() {
        const drawer = document.getElementById("drawer");
        const overlay = document.getElementById("overlay");

        if (drawer) drawer.classList.remove("aberto");
        if (overlay) overlay.classList.remove("aberto");

        document.body.style.overflow = "";
      }

      function enviarWpp() {
        garantirCarrinho();

        if (!carrinho.length) return;

        const obs = document.getElementById("obs").value.trim();

        const total = carrinho.reduce(
          (s, c) =>
            s + getPrecoFinal(c.produto) * (normalizarNumero(c.qtd) || 1),
          0,
        );

        let msg = `Olá! Gostaria de fazer um pedido no *${LOJA_NOME}* 💜\n\n*Itens do pedido:*\n`;

        carrinho.forEach((item) => {
          const qtd = normalizarNumero(item.qtd) || 1;
          const sub = getPrecoFinal(item.produto) * qtd;
          const temPromo = temPromocaoProduto(item.produto);

          msg += `• ${item.produto.nome} x${qtd} — ${formatarPreco(sub)}${temPromo ? " 🔥 promo" : ""}\n`;
        });

        msg += `\n*Total: ${formatarPreco(total)}*`;

        if (obs) {
          msg += `\n\n*Observações:* ${obs}`;
        }

        window.open(
          `https://wa.me/${WPP_NUM}?text=${encodeURIComponent(msg)}`,
          "_blank",
        );
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          fecharModalProdutoCatalogo();
        }
      });

      carregar();
    </script>
  </body>
</html>
