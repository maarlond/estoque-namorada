<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo — Leal Cosméticos</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <link rel="stylesheet" href="css/style.css" />
  <body>
    <!-- CURSOR -->
    <div id="cursor"></div>
    <div id="cursor-ring"></div>

    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="hero-eyebrow">Bem-vinda ao nosso espaço</div>
      <h1 class="hero-title">Leal<br /><em>Cosméticos</em></h1>
      <div id="textoExemplo" class="hero-sub"></div>
      <div class="hero-search">
        <input
          type="text"
          id="heroSearch"
          placeholder="Buscar produto..."
          oninput="buscar(this.value)"
        />
        <button onclick="buscar(document.getElementById('heroSearch').value)">
          Buscar
        </button>
      </div>
      <div class="hero-scroll">
        <div class="scroll-line"></div>
        <span>Produtos abaixo</span>
      </div>
    </section>

    <!-- STRIP -->
    <div class="strip-wrap">
      <div class="strip-track" id="strip"></div>
    </div>

    <!-- MAIN -->
    <main class="main">
      <div class="section-head">
        <div>
          <div class="section-label">Nossos Produtos</div>
          <h2 class="section-title">Escolha os seus<br />favoritos</h2>
        </div>
        <div class="filtros" id="filtros">
          <button
            class="chip chip-filtro ativo"
            onclick="filtrarCatalogo('todos', this)"
          >
            <span>Todos</span>
          </button>

          <button
            class="chip chip-filtro"
            onclick="filtrarCatalogo('promocoes', this)"
          >
            <span>🔥 Promoções</span>
          </button>

          <button
            class="chip chip-filtro"
            onclick="filtrarCatalogo('pronta', this)"
          >
            <span>✅ Pronta entrega</span>
          </button>

          <button
            class="chip chip-filtro"
            onclick="filtrarCatalogo('encomenda', this)"
          >
            <span>📦 Encomenda</span>
          </button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </main>

    <footer class="site-footer">Feito com 💜 · Leal Cosméticos © 2026</footer>

    <!-- FAB -->
    <div class="fab-wrap">
      <button class="fab" onclick="abrirDrawer()">
        <div class="fab-pulse"></div>
        🛍️
        <span class="fab-badge" id="fabBadge"></span>
      </button>
    </div>

    <button
      class="cart-summary-bar"
      id="cartSummaryBar"
      onclick="abrirDrawer()"
      type="button"
    >
      <span class="cart-summary-info">
        <span class="cart-summary-title" id="cartSummaryTitle">Meu pedido</span>
        <span class="cart-summary-total" id="cartSummaryTotal">R$ 0,00</span>
      </span>
      <span class="cart-summary-action">Ver pedido</span>
    </button>

    <nav class="bottom-nav-mobile" aria-label="Navegação do catálogo">
      <button
        type="button"
        id="navInicio"
        class="ativo"
        onclick="voltarInicioCatalogo()"
      >
        <span class="nav-ico">🏠</span>
        <span>Início</span>
      </button>
      <button
        type="button"
        id="navFavoritos"
        onclick="filtrarFavoritosNav(this)"
      >
        <span class="nav-ico">❤️</span>
        <span id="navFavoritosText">Favoritos</span>
      </button>
      <button type="button" id="navPedido" onclick="abrirDrawer()">
        <span class="nav-ico">🛒</span>
        <span id="navPedidoText">Pedido</span>
      </button>
    </nav>

    <!-- DRAWER -->
    <div class="overlay" id="overlay" onclick="fecharDrawer()"></div>
    <div class="drawer" id="drawer">
      <div class="drawer-head">
        <span class="drawer-head-title">Seu Pedido 🛍️</span>
        <button class="btn-close" onclick="fecharDrawer()">✕</button>
      </div>
      <div class="drawer-items" id="drawerItems">
        <div class="drawer-empty">
          Nenhum item ainda.<br />Adicione produtos ao lado! 💜
        </div>
      </div>
      <div class="drawer-foot">
        <div class="drawer-total">
          <span class="drawer-total-label">Total estimado</span>
          <span class="drawer-total-val" id="drawerTotal">R$ 0,00</span>
        </div>
        <textarea
          class="obs"
          id="obs"
          placeholder="Observação? Ex: endereço, forma de pagamento..."
        ></textarea>
        <button class="btn-wpp" id="btnWpp" onclick="enviarWpp()" disabled>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
            />
          </svg>
          Enviar pedido pelo WhatsApp
        </button>
      </div>
    </div>

    <!-- MODAL PRODUTO -->
    <div
      class="produto-modal-overlay"
      id="produtoModalOverlay"
      onclick="fecharModalProdutoCatalogo()"
    >
      <div class="produto-modal" onclick="event.stopPropagation()">
        <button
          class="produto-modal-close"
          type="button"
          onclick="fecharModalProdutoCatalogo()"
          aria-label="Fechar detalhes do produto"
        >
          ✕
        </button>

        <div class="produto-modal-img-wrap" id="produtoModalImg"></div>

        <div class="produto-modal-info">
          <div class="produto-modal-badges" id="produtoModalBadges"></div>
          <div class="produto-modal-marca" id="produtoModalMarca"></div>
          <h3 class="produto-modal-nome" id="produtoModalNome"></h3>
          <button
            class="produto-modal-favorito"
            id="produtoModalFavorito"
            type="button"
          ></button>
          <div class="produto-modal-preco" id="produtoModalPreco"></div>
          <div class="produto-modal-resumo" id="produtoModalResumo"></div>
          <p class="produto-modal-desc" id="produtoModalDesc"></p>
          <div class="produto-modal-estoque" id="produtoModalEstoque"></div>

          <button
            class="produto-modal-add"
            id="produtoModalBtnAdd"
            type="button"
          >
            + Adicionar ao pedido
          </button>
        </div>
      </div>
    </div>

    <script src="../js/catalogo.js"></script>
    <script src="../js/script.js"></script>
  </body>
</html>
